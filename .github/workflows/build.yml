      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true                       # سرعت بیلد

      - name: Create Android folder
        run: flutter create --platforms=android --project-name zeus_vpn --org ir.zeus .

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Pub get
        run: flutter pub get

      - name: Analyze                       # گرفتن خطاها قبل از بیلد
        run: flutter analyze --no-fatal-infos

      # ... (signing بدون تغییر، فقط شاخه‌ی ci/keystore.b64 را حذف کنید)

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"   # فیکس re-run
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --title "ZEUS VPN Build ${{ github.run_number }}" --generate-notes
