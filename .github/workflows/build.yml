name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate Android files
        run: flutter create --platforms=android --org com.zeus .
        
      # 🌟 سیستم قدرتمند آپدیت بدون حذف (Caching Keystore)
      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-debug-keystore-v2
          restore-keys: |
            ${{ runner.os }}-debug-keystore-
            
      - name: Generate Keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: zeus_vpn
          description: A Cyberpunk VPN app using Zeus Panel.
          version: 1.0.0+${{ github.run_number }}

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray_client: ^3.4.1
            dio: ^5.4.0
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          
      - name: Inject Custom main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter_v2ray_client/flutter_v2ray.dart';
          import 'package:flutter_v2ray_client/model/v2ray_status.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:ui';
          import 'dart:math';

          void main() {
            runApp(const ZeusVpnApp());
          }

          class ZeusVpnApp extends StatelessWidget {
            const ZeusVpnApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ZEUS VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF050505),
                ),
                home: const VpnHomePage(),
              );
            }
          }

          // 🌟 کلاس اختصاصی برای جلوگیری از باگ لیست سرورها
          class ServerNode {
            final String subTag;
            final String rawUri;
            final String displayName;
            String pingText;
            Color pingColor;

            ServerNode({
              required this.subTag,
              required this.rawUri,
              required this.displayName,
              this.pingText = '--',
              this.pingColor = Colors.grey,
            });
          }

          class VpnHomePage extends StatefulWidget {
            const VpnHomePage({super.key});

            @override
            State<VpnHomePage> createState() => _VpnHomePageState();
          }

          class _VpnHomePageState extends State<VpnHomePage> with TickerProviderStateMixin {
            final Dio _dio = Dio();
            
            List<String> _subUrls = [];
            List<ServerNode> _allNodes = [];
            String? _selectedNodeUri;
            
            bool _isInitialized = false;
            bool _isLoading = false;
            bool _isConnected = false;
            bool _isTestingSpeed = false;
            String _speedTestResult = '';
            
            String _liveLog = '> SYSTEM BOOTING...';

            String _uploadSpeed = '0 B/s';
            String _downloadSpeed = '0 B/s';
            String _duration = '00:00:00';
            String _status = 'DISCONNECTED';

            final Color neonCyan = const Color(0xFF00F0FF);
            final Color neonMagenta = const Color(0xFFFF007F);
            final Color neonGreen = const Color(0xFF00FF88);
            final Color darkBg = const Color(0xFF050505);

            late V2ray _v2ray;
            late AnimationController _pulseController;
            late AnimationController _rotateController;
            late Animation<double> _pulseAnimation;

            @override
            void initState() {
              super.initState();
              
              _pulseController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat(reverse: true);
              
              _rotateController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 4),
              )..repeat();

              _pulseAnimation = Tween<double>(begin: 0.95, end: 1.05).animate(
                CurvedAnimation(parent: _pulseController, curve: Curves.easeInOut),
              );

              _v2ray = V2ray(
                onStatusChanged: (V2RayStatus status) {
                  if (mounted) {
                    setState(() {
                      _status = status.state;
                      _isConnected = (status.state == 'CONNECTED');
                      
                      _uploadSpeed = _formatSpeed(status.uploadSpeed);
                      _downloadSpeed = _formatSpeed(status.downloadSpeed);
                      _duration = status.duration;
                      
                      if (_isConnected) {
                        _liveLog = '> SECURE TUNNEL ESTABLISHED. PATT-NG ACTIVE.';
                      } else {
                        _speedTestResult = '';
                        _uploadSpeed = '0 B/s';
                        _downloadSpeed = '0 B/s';
                        _duration = '00:00:00';
                        _liveLog = '> TUNNEL DISCONNECTED.';
                      }
                    });
                  }
                },
              );
              _initV2Ray();
              _loadSavedSubs();
            }

            Future<void> _initV2Ray() async {
              await _v2ray.initialize(
                notificationIconResourceType: "mipmap",
                notificationIconResourceName: "ic_launcher",
              );
              if (mounted) {
                setState(() {
                  _isInitialized = true;
                  _liveLog = '> CORE ONLINE. AWAITING COMMAND.';
                });
              }
            }

            @override
            void dispose() {
              _pulseController.dispose();
              _rotateController.dispose();
              super.dispose();
            }

            String _formatSpeed(int bytesPerSecond) {
              if (bytesPerSecond < 1024) return '$bytesPerSecond B/s';
              if (bytesPerSecond < 1024 * 1024) return '${(bytesPerSecond / 1024).toStringAsFixed(1)} KB/s';
              return '${(bytesPerSecond / (1024 * 1024)).toStringAsFixed(1)} MB/s';
            }

            Future<void> _loadSavedSubs() async {
              final prefs = await SharedPreferences.getInstance();
              _subUrls = prefs.getStringList('subUrls') ?? [];
              if (_subUrls.isNotEmpty) {
                _fetchAllConfigs();
              }
            }

            Future<void> _saveSubs() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('subUrls', _subUrls);
            }

            String _extractName(String uriStr) {
              try {
                final uri = Uri.parse(uriStr);
                if (uri.fragment.isNotEmpty) return Uri.decodeComponent(uri.fragment);
                return '${uri.host}:${uri.port}';
              } catch (_) { return 'Unknown Server'; }
            }

            String _applyPattNGSettings(String configUri) {
              try {
                final uri = Uri.parse(configUri);
                Map<String, String> queryParams = Map.from(uri.queryParameters);
                queryParams['fp'] = 'unsafe';
                queryParams['fragment'] = 'tlshello';
                return uri.replace(queryParameters: queryParams).toString();
              } catch (_) {
                return configUri;
              }
            }

            Future<void> _fetchAllConfigs() async {
              if (_subUrls.isEmpty) {
                setState(() => _liveLog = '> NO SUBSCRIPTIONS FOUND.');
                return;
              }
              
              setState(() { 
                _isLoading = true; 
                _allNodes = []; 
                _selectedNodeUri = null;
                _liveLog = '> FETCHING CONFIGS FROM ${_subUrls.length} SOURCES...';
              });

              List<ServerNode> fetchedNodes = [];

              for (int i = 0; i < _subUrls.length; i++) {
                String url = _subUrls[i];
                String subTag = 'SUB-${i + 1}';
                try {
                  final response = await _dio.get(
                    url,
                    options: Options(headers: {'User-Agent': 'v2rayNG/1.8.5'}),
                  );

                  String body = response.data.toString().trim();
                  try { body = utf8.decode(base64.decode(base64.normalize(body))); } catch (_) {}

                  final links = body.split('\n')
                      .map((e) => e.trim())
                      .where((e) => e.startsWith('vless://') || e.startsWith('trojan://') || e.startsWith('vmess://'))
                      .map((link) => _applyPattNGSettings(link))
                      .toList();

                  for (String link in links) {
                    fetchedNodes.add(ServerNode(
                      subTag: subTag,
                      rawUri: link,
                      displayName: '[$subTag] ${_extractName(link)}',
                    ));
                  }
                } catch (e) {
                  // Skip failed sub
                }
              }

              setState(() {
                _allNodes = fetchedNodes;
                if (_allNodes.isNotEmpty) {
                  _selectedNodeUri = _allNodes.first.rawUri;
                }
                _liveLog = '> ${_allNodes.length} NODES MERGED & SECURED.';
              });

              _testAllLatencies();

              setState(() => _isLoading = false);
            }

            Future<void> _testAllLatencies() async {
              for (var node in _allNodes) {
                _pingSingleServer(node);
              }
            }

            Future<void> _pingSingleServer(ServerNode node) async {
              try {
                final uri = Uri.parse(node.rawUri);
                final stopwatch = Stopwatch()..start();
                final socket = await Socket.connect(uri.host, uri.port, timeout: const Duration(seconds: 3));
                stopwatch.stop();
                socket.destroy();
                if (mounted) {
                  setState(() {
                    node.pingText = '${stopwatch.elapsedMilliseconds} ms';
                    int p = stopwatch.elapsedMilliseconds;
                    node.pingColor = p < 200 ? neonGreen : (p < 500 ? Colors.orange : neonMagenta);
                  });
                }
              } catch (e) {
                if (mounted) {
                  setState(() {
                    node.pingText = 'TIMEOUT';
                    node.pingColor = neonMagenta;
                  });
                }
              }
            }

            Future<void> _runSpeedTest() async {
              setState(() { _isTestingSpeed = true; _speedTestResult = 'TESTING...'; });
              try {
                final stopwatch = Stopwatch()..start();
                final response = await _dio.get(
                  'https://speed.cloudflare.com/__down?bytes=10000000',
                  options: Options(
                    responseType: ResponseType.bytes,
                    receiveTimeout: const Duration(seconds: 15),
                  ),
                );
                stopwatch.stop();
                double seconds = stopwatch.elapsedMilliseconds / 1000.0;
                if (seconds == 0) seconds = 0.1;
                double bytes = response.data.length.toDouble();
                double speedMbps = (bytes * 8) / (seconds * 1024 * 1024);
                setState(() {
                  _speedTestResult = '${speedMbps.toStringAsFixed(1)} Mbps';
                  _liveLog = '> BANDWIDTH SCAN: $_speedTestResult';
                });
              } catch (e) {
                setState(() {
                  _speedTestResult = 'FAILED';
                  _liveLog = '> SPEED TEST TIMEOUT.';
                });
              } finally {
                setState(() => _isTestingSpeed = false);
              }
            }

            Future<void> _toggleConnection() async {
              if (!_isInitialized) { _showSnackBar('Core is initializing...', isError: true); return; }
              if (_isConnected) { await _v2ray.stopV2Ray(); return; }
              if (_selectedNodeUri == null) { _showSnackBar('Please select a server first.', isError: true); return; }

              setState(() => _liveLog = '> INITIATING SECURE TUNNEL...');

              final hasPermission = await _v2ray.requestPermission();
              if (!hasPermission) { 
                setState(() => _liveLog = '> ERROR: VPN PERMISSION DENIED.');
                _showSnackBar('VPN permission denied.', isError: true); 
                return; 
              }

              final parser = V2ray.parseFromURL(_selectedNodeUri!);
              await _v2ray.startV2Ray(
                remark: parser.remark,
                config: parser.getFullConfiguration(),
                proxyOnly: false,
              );
            }

            void _showSnackBar(String msg, {bool isError = false}) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(msg, style: const TextStyle(color: Colors.white)),
                  backgroundColor: isError ? neonMagenta : neonGreen,
                  behavior: SnackBarBehavior.floating,
                )
              );
            }

            // 🚀 مدیریت اشتراک‌ها
            void _showSubscriptionManager() {
              TextEditingController newSubController = TextEditingController();
              
              showModalBottomSheet(
                context: context,
                backgroundColor: Colors.transparent,
                isScrollControlled: true,
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        height: MediaQuery.of(context).size.height * 0.7,
                        decoration: BoxDecoration(
                          color: const Color(0xFF0A0A0F),
                          borderRadius: const BorderRadius.vertical(top: Radius.circular(20)),
                          border: Border(top: BorderSide(color: neonCyan.withOpacity(0.5), width: 2)),
                        ),
                        child: Column(
                          children: [
                            const SizedBox(height: 10),
                            Container(width: 50, height: 4, decoration: BoxDecoration(color: neonCyan.withOpacity(0.5), borderRadius: BorderRadius.circular(10))),
                            const SizedBox(height: 15),
                            Text('SUBSCRIPTION MANAGER', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: neonCyan, letterSpacing: 2)),
                            const SizedBox(height: 15),
                            
                            Padding(
                              padding: const EdgeInsets.symmetric(horizontal: 15),
                              child: Row(
                                children: [
                                  Expanded(
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 10),
                                      decoration: BoxDecoration(
                                        color: Colors.white.withOpacity(0.05),
                                        border: Border.all(color: neonMagenta.withOpacity(0.3)),
                                        borderRadius: BorderRadius.circular(10),
                                      ),
                                      child: TextField(
                                        controller: newSubController,
                                        style: const TextStyle(color: Colors.white, fontSize: 12),
                                        decoration: InputDecoration(
                                          hintText: 'PASTE NEW SUB LINK...',
                                          hintStyle: TextStyle(color: Colors.white.withOpacity(0.2), fontSize: 11),
                                          border: InputBorder.none,
                                        ),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  GestureDetector(
                                    onTap: () {
                                      if (newSubController.text.isNotEmpty) {
                                        setState(() => _subUrls.add(newSubController.text.trim()));
                                        _saveSubs();
                                        newSubController.clear();
                                        setModalState(() {});
                                      }
                                    },
                                    child: Container(
                                      padding: const EdgeInsets.all(12),
                                      decoration: BoxDecoration(
                                        color: neonGreen.withOpacity(0.1),
                                        border: Border.all(color: neonGreen.withOpacity(0.5)),
                                        borderRadius: BorderRadius.circular(10),
                                      ),
                                      child: Icon(Icons.add, color: neonGreen, size: 20),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            
                            const SizedBox(height: 15),
                            
                            Expanded(
                              child: _subUrls.isEmpty 
                                ? Center(child: Text('NO SUBSCRIPTIONS ADDED', style: TextStyle(color: Colors.white.withOpacity(0.3))))
                                : ListView.builder(
                                    padding: const EdgeInsets.symmetric(horizontal: 15),
                                    itemCount: _subUrls.length,
                                    itemBuilder: (context, index) {
                                      return Container(
                                        margin: const EdgeInsets.only(bottom: 10),
                                        padding: const EdgeInsets.all(15),
                                        decoration: BoxDecoration(
                                          color: Colors.white.withOpacity(0.02),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: neonCyan.withOpacity(0.2)),
                                        ),
                                        child: Row(
                                          children: [
                                            Icon(Icons.link, color: neonCyan, size: 18),
                                            const SizedBox(width: 10),
                                            Expanded(
                                              child: Text(
                                                _subUrls[index],
                                                style: TextStyle(color: Colors.white.withOpacity(0.7), fontSize: 12),
                                                maxLines: 1,
                                                overflow: TextOverflow.ellipsis,
                                              ),
                                            ),
                                            IconButton(
                                              icon: Icon(Icons.delete, color: neonMagenta, size: 20),
                                              onPressed: () {
                                                setState(() => _subUrls.removeAt(index));
                                                _saveSubs();
                                                setModalState(() {});
                                              },
                                            ),
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                            ),
                            
                            Padding(
                              padding: const EdgeInsets.all(15),
                              child: SizedBox(
                                width: double.infinity,
                                height: 50,
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: neonCyan.withOpacity(0.1),
                                    side: BorderSide(color: neonCyan),
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                  ),
                                  onPressed: () {
                                    Navigator.pop(context);
                                    _fetchAllConfigs();
                                  },
                                  child: Text('SAVE & SYNC ALL', style: TextStyle(color: neonCyan, fontWeight: FontWeight.bold, letterSpacing: 2)),
                                ),
                              ),
                            )
                          ],
                        ),
                      );
                    }
                  );
                }
              );
            }

            // 🚀 نمایش لیست سرورها
            void _showServerListModal() {
              showModalBottomSheet(
                context: context,
                backgroundColor: Colors.transparent,
                isScrollControlled: true,
                builder: (context) {
                  return Container(
                    height: MediaQuery.of(context).size.height * 0.6,
                    decoration: BoxDecoration(
                      color: const Color(0xFF0A0A0F),
                      borderRadius: const BorderRadius.vertical(top: Radius.circular(20)),
                      border: Border(top: BorderSide(color: neonCyan.withOpacity(0.5), width: 2)),
                    ),
                    child: Column(
                      children: [
                        const SizedBox(height: 10),
                        Container(width: 50, height: 4, decoration: BoxDecoration(color: neonCyan.withOpacity(0.5), borderRadius: BorderRadius.circular(10))),
                        const SizedBox(height: 15),
                        Text('NODE SELECTION', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: neonCyan, letterSpacing: 2)),
                        const SizedBox(height: 10),
                        Expanded(
                          child: ListView.builder(
                            padding: const EdgeInsets.symmetric(horizontal: 15),
                            itemCount: _allNodes.length,
                            itemBuilder: (context, index) {
                              final node = _allNodes[index];
                              final isSelected = node.rawUri == _selectedNodeUri;

                              return GestureDetector(
                                onTap: () {
                                  setState(() => _selectedNodeUri = node.rawUri);
                                  Navigator.pop(context);
                                },
                                child: AnimatedContainer(
                                  duration: const Duration(milliseconds: 200),
                                  margin: const EdgeInsets.only(bottom: 10),
                                  padding: const EdgeInsets.all(15),
                                  decoration: BoxDecoration(
                                    color: isSelected ? neonCyan.withOpacity(0.15) : Colors.white.withOpacity(0.03),
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(color: isSelected ? neonCyan : Colors.transparent),
                                  ),
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Expanded(
                                        child: Text(node.displayName, style: TextStyle(color: isSelected ? Colors.white : Colors.white70, fontWeight: isSelected ? FontWeight.bold : FontWeight.normal)),
                                      ),
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                        decoration: BoxDecoration(
                                          color: node.pingColor.withOpacity(0.1),
                                          borderRadius: BorderRadius.circular(4),
                                          border: Border.all(color: node.pingColor.withOpacity(0.5)),
                                        ),
                                        child: Text(node.pingText, style: TextStyle(color: node.pingColor, fontSize: 10, fontWeight: FontWeight.bold)),
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  );
                }
              );
            }

            @override
            Widget build(BuildContext context) {
              String selectedName = 'TAP TO SELECT NODE';
              String selectedPing = '--';
              Color selectedPingColor = Colors.grey;

              if (_selectedNodeUri != null) {
                final node = _allNodes.firstWhere((element) => element.rawUri == _selectedNodeUri, orElse: () => _allNodes.first);
                selectedName = node.displayName;
                selectedPing = node.pingText;
                selectedPingColor = node.pingColor;
              }

              return Scaffold(
                backgroundColor: darkBg,
                body: Stack(
                  children: [
                    Positioned.fill(child: CustomPaint(painter: CyberGridPainter(neonCyan.withOpacity(0.05)))),
                    Positioned(
                      top: -100, left: -100,
                      child: Container(width: 300, height: 300, decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonCyan.withOpacity(0.1), blurRadius: 100, spreadRadius: 50)])),
                    ),
                    Positioned(
                      bottom: -100, right: -100,
                      child: Container(width: 300, height: 300, decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonMagenta.withOpacity(0.1), blurRadius: 100, spreadRadius: 50)])),
                    ),
                    
                    SafeArea(
                      child: Column(
                        children: [
                          Padding(
                            padding: const EdgeInsets.only(top: 20, bottom: 10),
                            child: TweenAnimationBuilder<double>(
                              tween: Tween(begin: -1, end: 1),
                              duration: const Duration(milliseconds: 200),
                              builder: (context, value, child) {
                                return Transform.translate(
                                  offset: Offset(sin(value * pi) * 2, 0),
                                  child: Text(
                                    'ZEUS VPN',
                                    style: TextStyle(
                                      fontSize: 32,
                                      fontWeight: FontWeight.w900,
                                      letterSpacing: 8,
                                      color: Colors.white,
                                      shadows: [Shadow(color: neonCyan, blurRadius: 10), Shadow(color: neonMagenta, blurRadius: 20)],
                                    ),
                                  ),
                                );
                              },
                            ),
                          ),
                          
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 20),
                            child: GestureDetector(
                              onTap: _showSubscriptionManager,
                              child: Container(
                                padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 15),
                                decoration: BoxDecoration(
                                  color: neonCyan.withOpacity(0.05),
                                  border: Border.all(color: neonCyan.withOpacity(0.3)),
                                  borderRadius: BorderRadius.circular(10),
                                ),
                                child: Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                  children: [
                                    Row(
                                      children: [
                                        Icon(Icons.layers, color: neonCyan, size: 18),
                                        const SizedBox(width: 10),
                                        Text('SUBSCRIPTIONS', style: TextStyle(color: neonCyan, fontSize: 12, fontWeight: FontWeight.bold, letterSpacing: 1)),
                                      ],
                                    ),
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                      decoration: BoxDecoration(color: neonMagenta.withOpacity(0.2), borderRadius: BorderRadius.circular(10)),
                                      child: Text('${_subUrls.length} ACTIVE', style: TextStyle(color: neonMagenta, fontSize: 10, fontWeight: FontWeight.bold)),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ),
                          
                          const SizedBox(height: 15),

                          GestureDetector(
                            onTap: _allNodes.isEmpty ? () => _showSnackBar('Fetch servers first!', isError: true) : _showServerListModal,
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.05),
                                borderRadius: BorderRadius.circular(30),
                                border: Border.all(color: neonMagenta.withOpacity(0.5)),
                              ),
                              child: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Icon(Icons.dns, color: neonMagenta, size: 16),
                                  const SizedBox(width: 10),
                                  ConstrainedBox(
                                    constraints: const BoxConstraints(maxWidth: 150),
                                    child: Text(selectedName, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13), overflow: TextOverflow.ellipsis),
                                  ),
                                  if (selectedPing != '--') ...[
                                    const SizedBox(width: 8),
                                    Text('[$selectedPing]', style: TextStyle(color: selectedPingColor, fontSize: 11, fontWeight: FontWeight.bold)),
                                  ],
                                  const SizedBox(width: 8),
                                  Icon(Icons.keyboard_arrow_down, color: neonMagenta, size: 16),
                                ],
                              ),
                            ),
                          ),

                          const Spacer(),

                          GestureDetector(
