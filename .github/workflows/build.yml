name: Build and Verify ZEUS VPN

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish signed release APKs after certificate verification"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      verify_signing_identity:
        description: "Only compare the current GitHub signing secret with the certificate in the previously distributed APK"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  group: zeus-vpn-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name zeus_vpn --org ir.zeus .

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Verify Android security and signing-file hygiene
        run: |
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = ET.parse(manifest_path).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = manifest.find("application")
          assert app is not None, "Android application element is missing"
          assert app.get(android + "allowBackup") == "false", "Android Auto Backup must be disabled"
          assert app.get(android + "usesCleartextTraffic") == "false", "Cleartext HTTP must be disabled"
          assert app.get(android + "label") == "ZEUS VPN", "Application label is not branded"

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_file = gradle_kts if gradle_kts.is_file() else Path("android/app/build.gradle")
          gradle_text = gradle_file.read_text(encoding="utf-8")
          expected_application_id = "ir.zeus.zeus_vpn"
          application_id_line = (
              f'applicationId = "{expected_application_id}"'
              if gradle_file.suffix == ".kts"
              else f'applicationId "{expected_application_id}"'
          )
          assert application_id_line in gradle_text, (
              "Application ID must remain ir.zeus.zeus_vpn to preserve update compatibility"
          )
          debug_suffix = (
              'applicationIdSuffix = ".debug"'
              if gradle_file.suffix == ".kts"
              else 'applicationIdSuffix ".debug"'
          )
          assert debug_suffix in gradle_text, "Debug APK must use a separate .debug application ID"
          minimum_sdk = (
              "minSdk = maxOf(flutter.minSdkVersion, 24)"
              if gradle_file.suffix == ".kts"
              else "minSdkVersion Math.max(flutter.minSdkVersion, 24)"
          )
          assert minimum_sdk in gradle_text, "Android minSdk must be at least API 24 for secure credential storage"

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.split("\0")
          forbidden_exact = {
              "ci/keystore.b64",
              "key.properties",
              "android/key.properties",
              "android/app/key.properties",
              "release.properties",
          }
          forbidden_suffixes = (".jks", ".keystore", ".p12", ".pfx")
          signing_files = [
              path for path in tracked
              if path in forbidden_exact
              or Path(path).name.lower() in {"key.properties", "release.properties"}
              or path.lower().endswith(forbidden_suffixes)
          ]
          assert not signing_files, (
              "Signing material must never be committed: " + ", ".join(signing_files)
          )
          print("Android backup policy, cleartext policy, branding, isolated debug package, and signing-file hygiene verified.")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: zeus-vpn-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit and widget tests
        run: flutter test

      - name: Build debug verification APK
        run: flutter build apk --debug

      - name: Upload debug verification APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-vpn-debug-verification
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-keystore:
    name: Verify real Android Keystore migration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name zeus_vpn --org ir.zeus .

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run Android Keystore integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/credential_vault_integration_test.dart -d emulator-5554

  verify-signing-identity:
    name: Verify existing release signing identity (no APK publish)
    if: github.event_name == 'workflow_dispatch' && inputs.verify_signing_identity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compare GitHub keystore certificate with the previously distributed APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing value is missing: $name"
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/zeus-signing-check"
          key_file="$RUNNER_TEMP/zeus-signing-check/release.jks"
          chmod 700 "$RUNNER_TEMP/zeus-signing-check"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"

          actual="$(keytool -list -v -keystore "$key_file" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="BC9439740C809594CE3CBEEAF9ED942B08B6C9E36CAE8BC1E2B649490A68FB2C"

          if [ -z "$actual" ]; then
            echo "::error::Could not read the active release certificate from the configured keystore."
            exit 1
          fi
          echo "Current release certificate SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The active GitHub signing secret does not match the certificate in previously distributed ZEUS VPN v2.10.1 APKs. Do not publish an update until the signing identity is reconciled."
            exit 1
          fi
          echo "::notice::The active signing identity matches the previously distributed ZEUS VPN APK certificate. No APK was built or published by this verification job."

  release:
    name: Build and publish signed release APKs
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
    needs: [verify, android-keystore]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name zeus_vpn --org ir.zeus .

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Configure and verify release signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: 'BC9439740C809594CE3CBEEAF9ED942B08B6C9E36CAE8BC1E2B649490A68FB2C'
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing value is missing: $name"
              exit 1
            fi
          done

          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/zeus.jks
          chmod 600 android/app/zeus.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=zeus.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties

          actual="$(keytool -list -v -keystore android/app/zeus.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Release certificate SHA-256 does not match ANDROID_RELEASE_CERT_SHA256."
            exit 1
          fi
          echo "Release signing certificate fingerprint matches the pinned repository variable."
          python3 tools/patch_signing.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Name release APKs
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/+.*//')"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/ZEUS-VPN-v${version}-${abi}.apk"
          done
          ls -la dist

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}-${{ github.run_attempt }}"
          version="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/+.*//')"
          gh release create "$tag" dist/*.apk \
            --title "ZEUS VPN v${version} (Build ${{ github.run_number }})" \
            --generate-notes
