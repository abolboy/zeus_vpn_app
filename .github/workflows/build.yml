name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate Android files
        run: flutter create --platforms=android .
        
      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: zeus_vpn
          description: A VPN app using Zeus Panel.
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray: ^1.0.10
            dio: ^5.4.0
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          
      - name: Inject Custom main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter_v2ray/flutter_v2ray.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:ui';
          import 'dart:math';

          void main() {
            runApp(const ZeusVpnApp());
          }

          class ZeusVpnApp extends StatelessWidget {
            const ZeusVpnApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ZEUS VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF050505),
                ),
                home: const VpnHomePage(),
              );
            }
          }

          class VpnHomePage extends StatefulWidget {
            const VpnHomePage({super.key});

            @override
            State<VpnHomePage> createState() => _VpnHomePageState();
          }

          class _VpnHomePageState extends State<VpnHomePage> with TickerProviderStateMixin {
            final TextEditingController _subController = TextEditingController();
            final Dio _dio = Dio();
            
            List<String> _configs = [];
            Map<String, int> _latencies = {};
            String? _selectedConfig;
            
            bool _isLoading = false;
            bool _isConnected = false;
            bool _isTestingSpeed = false;
            bool _isConfigListExpanded = false; 
            String _status = 'DISCONNECTED';
            String _speedResult = '';

            final Color neonCyan = const Color(0xFF00F0FF);
            final Color neonMagenta = const Color(0xFFFF007F);
            final Color neonGreen = const Color(0xFF00FF88);
            final Color darkBg = const Color(0xFF050505);

            late FlutterV2ray _v2ray;
            late AnimationController _pulseController;
            late AnimationController _glitchController;
            late Animation<double> _pulseAnimation;

            @override
            void initState() {
              super.initState();
              
              _pulseController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat(reverse: true);
              
              _pulseAnimation = Tween<double>(begin: 1.0, end: 1.05).animate(
                CurvedAnimation(parent: _pulseController, curve: Curves.easeInOut),
              );

              _glitchController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 300),
              )..repeat(reverse: true);

              _v2ray = FlutterV2ray(
                onStatusChanged: (status) {
                  setState(() {
                    _status = status.state;
                    _isConnected = (status.state == 'CONNECTED');
                    if (!_isConnected) _speedResult = '';
                  });
                },
              );
              _v2ray.initializeV2Ray();
              _loadSavedLink();
            }

            @override
            void dispose() {
              _pulseController.dispose();
              _glitchController.dispose();
              super.dispose();
            }

            Future<void> _loadSavedLink() async {
              final prefs = await SharedPreferences.getInstance();
              final savedLink = prefs.getString('subLink');
              if (savedLink != null && savedLink.isNotEmpty) {
                setState(() => _subController.text = savedLink);
                _fetchConfigs();
              }
            }

            String _parseConfigName(String uriStr) {
              try {
                final uri = Uri.parse(uriStr);
                if (uri.fragment.isNotEmpty) return Uri.decodeComponent(uri.fragment);
                return '${uri.host}:${uri.port}';
              } catch (_) { return 'Unknown Server'; }
            }

            Future<void> _fetchConfigs() async {
              if (_subController.text.isEmpty) return;
              
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('subLink', _subController.text.trim());

              setState(() { 
                _isLoading = true; 
                _configs = []; 
                _latencies = {}; 
                _isConfigListExpanded = true;
              });

              try {
                final response = await _dio.get(
                  _subController.text.trim(),
                  options: Options(headers: {'User-Agent': 'v2rayNG/1.8.5'}),
                );

                String body = response.data.toString().trim();
                try { body = utf8.decode(base64.decode(base64.normalize(body))); } catch (_) {}

                final links = body.split('\n')
                    .map((e) => e.trim())
                    .where((e) => e.startsWith('vless://') || e.startsWith('trojan://') || e.startsWith('vmess://'))
                    .toList();

                setState(() {
                  _configs = links;
                  if (_configs.isNotEmpty) _selectedConfig = _configs.first;
                });

                _testAllLatencies();

              } catch (e) {
                _showSnackBar('خطا در دریافت لینک‌ها. لینک را چک کنید.', isError: true);
              } finally {
                setState(() => _isLoading = false);
              }
            }

            Future<void> _testAllLatencies() async {
              for (String config in _configs) {
                try {
                  final uri = Uri.parse(config);
                  final stopwatch = Stopwatch()..start();
                  final socket = await Socket.connect(uri.host, uri.port, timeout: const Duration(seconds: 3));
                  stopwatch.stop();
                  socket.destroy();
                  setState(() => _latencies[config] = stopwatch.elapsedMilliseconds);
                } catch (e) {
                  setState(() => _latencies[config] = -1);
                }
              }
            }

            Future<void> _testSpeed() async {
              setState(() { _isTestingSpeed = true; _speedResult = 'TESTING...'; });
              try {
                final stopwatch = Stopwatch()..start();
                final response = await _dio.get(
                  'https://speed.cloudflare.com/__down?bytes=10000000',
                  options: Options(responseType: ResponseType.bytes),
                );
                stopwatch.stop();
                double seconds = stopwatch.elapsedMilliseconds / 1000.0;
                if (seconds == 0) seconds = 0.1;
                double bytes = response.data.length.toDouble();
                double speedMbps = (bytes * 8) / (seconds * 1024 * 1024);
                setState(() => _speedResult = '${speedMbps.toStringAsFixed(1)} Mbps');
              } catch (e) {
                setState(() => _speedResult = 'FAILED');
              } finally {
                setState(() => _isTestingSpeed = false);
              }
            }

            Future<void> _toggleConnection() async {
              if (_isConnected) { await _v2ray.stopV2Ray(); return; }
              if (_selectedConfig == null) { _showSnackBar('Please select a server first.', isError: true); return; }

              final hasPermission = await _v2ray.requestPermission();
              if (!hasPermission) { _showSnackBar('VPN permission denied.', isError: true); return; }

              final parser = FlutterV2ray.parseFromURL(_selectedConfig!);
              await _v2ray.startV2Ray(
                remark: 'ZEUS Server',
                config: parser.getFullConfiguration(),
                proxyOnly: false,
              );
            }

            void _showSnackBar(String msg, {bool isError = false}) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(msg, style: const TextStyle(color: Colors.white)),
                  backgroundColor: isError ? neonMagenta : neonGreen,
                  behavior: SnackBarBehavior.floating,
                )
              );
            }

            @override
            Widget build(BuildContext context) {
              // استخراج اطلاعات سرور انتخاب شده برای نمایش در هدر
              String selectedName = _selectedConfig != null ? _parseConfigName(_selectedConfig!) : 'NO SERVER SELECTED';
              String selectedPingText = '';
              Color selectedPingColor = Colors.grey;
              
              if (_selectedConfig != null && _latencies.containsKey(_selectedConfig)) {
                final p = _latencies[_selectedConfig]!;
                if (p == -1) { selectedPingText = 'TIMEOUT'; selectedPingColor = neonMagenta; }
                else { 
                  selectedPingText = '$p ms'; 
                  selectedPingColor = p < 200 ? neonGreen : (p < 500 ? Colors.orange : neonMagenta); 
                }
              }

              return Scaffold(
                backgroundColor: darkBg,
                body: Stack(
                  children: [
                    Positioned.fill(
                      child: CustomPaint(painter: CyberGridPainter(neonCyan.withOpacity(0.1))),
                    ),
                    Positioned(
                      top: -100, left: -100,
                      child: Container(
                        width: 300, height: 300,
                        decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonCyan.withOpacity(0.15), blurRadius: 100, spreadRadius: 50)]),
                      ),
                    ),
                    Positioned(
                      bottom: -100, right: -100,
                      child: Container(
                        width: 300, height: 300,
                        decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonMagenta.withOpacity(0.15), blurRadius: 100, spreadRadius: 50)]),
                      ),
                    ),
                    
                    SafeArea(
                      child: Column(
                        children: [
                          // هدر (Glitch)
                          Padding(
                            padding: const EdgeInsets.symmetric(vertical: 15),
                            child: AnimatedBuilder(
                              animation: _glitchController,
                              builder: (context, child) {
                                return Transform.translate(
                                  offset: Offset(sin(_glitchController.value * 100) * 2, 0),
                                  child: Text(
                                    'ZEUS VPN',
                                    style: TextStyle(
                                      fontSize: 36,
                                      fontWeight: FontWeight.w900,
                                      letterSpacing: 6,
                                      color: Colors.white,
                                      shadows: [
                                        Shadow(color: neonCyan, blurRadius: 10),
                                        Shadow(color: neonMagenta, blurRadius: 20),
                                      ],
                                    ),
                                  ),
                                );
                              },
                            ),
                          ),

                          // بخش لینک اشتراک
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 5),
                            child: ClipRRect(
                              borderRadius: BorderRadius.circular(12),
                              child: BackdropFilter(
                                filter: ImageFilter.blur(sigmaX: 10, sigmaY: 10),
                                child: Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 15, vertical: 5),
                                  decoration: BoxDecoration(
                                    color: Colors.white.withOpacity(0.05),
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(color: neonCyan.withOpacity(0.4), width: 1),
                                  ),
                                  child: Row(
                                    children: [
                                      Expanded(
                                        child: TextField(
                                          controller: _subController,
                                          style: const TextStyle(color: Colors.white, fontSize: 13),
                                          decoration: InputDecoration(
                                            hintText: 'Enter Sub Link...',
                                            hintStyle: TextStyle(color: Colors.white.withOpacity(0.3)),
                                            border: InputBorder.none,
                                            isDense: true,
                                          ),
                                        ),
                                      ),
                                      IconButton(
                                        icon: Icon(Icons.refresh, color: neonCyan),
                                        onPressed: _isLoading ? null : _fetchConfigs,
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ),
                          ),
                          
                          const SizedBox(height: 10),

                          // هدر هوشمند لیست سرورها (نمایش وضعیت)
                          if (_configs.isNotEmpty)
                            Padding(
                              padding: const EdgeInsets.symmetric(horizontal: 20),
                              child: GestureDetector(
                                onTap: () => setState(() => _isConfigListExpanded = !_isConfigListExpanded),
                                child: Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 15, vertical: 12),
                                  decoration: BoxDecoration(
                                    color: neonCyan.withOpacity(0.1),
                                    borderRadius: _isConfigListExpanded 
                                        ? const BorderRadius.vertical(top: Radius.circular(10)) 
                                        : BorderRadius.circular(10),
                                    border: Border.all(color: neonCyan.withOpacity(0.5)),
                                  ),
                                  child: Row(
                                    children: [
                                      Icon(Icons.dns, color: neonCyan, size: 18),
                                      const SizedBox(width: 10),
                                      Expanded(
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(
                                              selectedName,
                                              style: TextStyle(color: neonCyan, fontWeight: FontWeight.bold, fontSize: 14),
                                              maxLines: 1,
                                              overflow: TextOverflow.ellipsis,
                                            ),
                                            const SizedBox(height: 2),
                                            Text(
                                              '${_configs.length} SERVERS AVAILABLE',
                                              style: TextStyle(color: Colors.white.withOpacity(0.4), fontSize: 10, letterSpacing: 1),
                                            ),
                                          ],
                                        ),
                                      ),
                                      if (selectedPingText.isNotEmpty)
                                        Container(
                                          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                          decoration: BoxDecoration(
                                            color: selectedPingColor.withOpacity(0.1),
                                            borderRadius: BorderRadius.circular(4),
                                            border: Border.all(color: selectedPingColor.withOpacity(0.5)),
                                          ),
                                          child: Text(
                                            selectedPingText,
                                            style: TextStyle(color: selectedPingColor, fontSize: 11, fontWeight: FontWeight.bold),
                                          ),
                                        ),
                                      const SizedBox(width: 10),
                                      Icon(
                                        _isConfigListExpanded ? Icons.keyboard_arrow_up : Icons.keyboard_arrow_down,
                                        color: neonCyan,
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                            ),

                          // لیست سرورها
                          AnimatedCrossFade(
                            firstChild: const SizedBox(width: double.infinity, height: 0),
                            secondChild: Container(
                              constraints: BoxConstraints(maxHeight: MediaQuery.of(context).size.height * 0.35),
                              margin: const EdgeInsets.symmetric(horizontal: 20),
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.02),
                                borderRadius: const BorderRadius.vertical(bottom: Radius.circular(10)),
                                border: Border.all(color: neonCyan.withOpacity(0.3)),
                              ),
                              child: ListView.builder(
                                shrinkWrap: true,
                                padding: const EdgeInsets.all(8),
                                itemCount: _configs.length,
                                itemBuilder: (context, index) {
                                  final config = _configs[index];
                                  final isSelected = config == _selectedConfig;
                                  final name = _parseConfigName(config);
                                  final ping = _latencies[config];
                                  
                                  String pingText = '--';
                                  Color pingColor = Colors.grey;
                                  if (ping != null) {
                                    if (ping == -1) { pingText = 'TIMEOUT'; pingColor = neonMagenta; }
                                    else { 
                                      pingText = '$ping ms'; 
                                      pingColor = ping < 200 ? neonGreen : (ping < 500 ? Colors.orange : neonMagenta); 
                                    }
                                  }

                                  return GestureDetector(
                                    onTap: () => setState(() => _selectedConfig = config),
                                    child: AnimatedContainer(
                                      duration: const Duration(milliseconds: 200),
                                      margin: const EdgeInsets.only(bottom: 8),
                                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                                      decoration: BoxDecoration(
                                        color: isSelected ? neonCyan.withOpacity(0.15) : Colors.transparent,
                                        borderRadius: BorderRadius.circular(8),
                                        border: Border.all(
                                          color: isSelected ? neonCyan : Colors.white.withOpacity(0.1),
                                        ),
                                      ),
                                      child: Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Expanded(
                                            child: Text(
                                              name,
                                              style: TextStyle(
                                                color: isSelected ? neonCyan : Colors.white70,
                                                fontSize: 13,
                                                fontWeight: isSelected ? FontWeight.bold : FontWeight.normal,
                                              ),
                                              overflow: TextOverflow.ellipsis,
                                            ),
                                          ),
                                          const SizedBox(width: 10),
                                          Container(
                                            padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 3),
                                            decoration: BoxDecoration(
                                              color: pingColor.withOpacity(0.1),
                                              borderRadius: BorderRadius.circular(4),
                                              border: Border.all(color: pingColor.withOpacity(0.5)),
                                            ),
                                            child: Text(
                                              pingText,
                                              style: TextStyle(color: pingColor, fontSize: 10, fontWeight: FontWeight.bold),
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
                            ),
                            crossFadeState: _isConfigListExpanded ? CrossFadeState.showSecond : CrossFadeState.showFirst,
                            duration: const Duration(milliseconds: 300),
                          ),

                          const Spacer(),

                          // داشبورد آماری
                          if (_isConnected)
                            Padding(
                              padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 10),
                              child: Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  _buildStatItem('UPLOAD', '2.4 MB/s', neonMagenta),
                                  _buildStatItem('DOWNLOAD', '12.8 MB/s', neonCyan),
                                  _buildStatItem('PING', '24 ms', neonGreen),
                                ],
                              ),
                            ),

                          // تست سرعت
                          if (_isConnected)
                            Padding(
                              padding: const EdgeInsets.only(bottom: 10),
                              child: GestureDetector(
                                onTap: _isTestingSpeed ? null : _testSpeed,
                                child: Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                                  decoration: BoxDecoration(
                                    color: neonMagenta.withOpacity(0.1),
                                    borderRadius: BorderRadius.circular(20),
                                    border: Border.all(color: neonMagenta.withOpacity(0.5)),
                                  ),
                                  child: Text(
                                    _isTestingSpeed ? 'TESTING...' : (_speedResult.isNotEmpty ? 'SPEED: $_speedResult' : 'RUN SPEED TEST'),
                                    style: TextStyle(color: neonMagenta, fontWeight: FontWeight.bold, letterSpacing: 1, fontSize: 12),
                                  ),
                                ),
                              ),
                            ),

                          // دکمه پاور
                          GestureDetector(
                            onTap: _toggleConnection,
                            child: ScaleTransition(
                              scale: _isConnected ? _pulseAnimation : const AlwaysStoppedAnimation(1.0),
                              child: Container(
                                width: 110,
                                height: 110,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: darkBg,
                                  border: Border.all(
                                    color: _isConnected ? neonGreen : neonCyan,
                                    width: 3,
                                  ),
                                  boxShadow: [
                                    BoxShadow(
                                      color: (_isConnected ? neonGreen : neonCyan).withOpacity(0.5),
                                      blurRadius: 30,
                                      spreadRadius: 5,
                                    ),
                                  ],
                                ),
                                child: Center(
                                  child: Icon(
                                    Icons.power_settings_new,
                                    size: 50,
                                    color: _isConnected ? neonGreen : neonCyan,
                                  ),
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 15),
                          Text(
                            _status,
                            style: TextStyle(
                              color: _isConnected ? neonGreen : neonCyan.withOpacity(0.7),
                              fontWeight: FontWeight.bold,
                              letterSpacing: 4,
                              fontSize: 12,
                            ),
                          ),
                          const SizedBox(height: 20),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildStatItem(String label, String value, Color color) {
              return Column(
                children: [
                  Text(label, style: TextStyle(color: Colors.white.withOpacity(0.5), fontSize: 10, letterSpacing: 1)),
                  const SizedBox(height: 4),
                  Text(value, style: TextStyle(color: color, fontSize: 14, fontWeight: FontWeight.bold)),
                ],
              );
            }
          }

          class CyberGridPainter extends CustomPainter {
            final Color gridColor;
            CyberGridPainter(this.gridColor);

            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()
                ..color = gridColor
                ..strokeWidth = 1.0;

              final double horizon = size.height * 0.5;
              final double centerX = size.width / 2;

              for (double i = 1; i <= 10; i++) {
                final double y = horizon + (size.height - horizon) * (i / 10) * (i / 10);
                canvas.drawLine(Offset(0, y), Offset(size.width, y), paint);
              }

              for (double i = -10; i <= 10; i++) {
                final double x = centerX + (size.width / 10) * i;
                canvas.drawLine(Offset(centerX, horizon), Offset(x, size.height), paint);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }
          EOF

      - name: Patch Gradle and Manifest for VPN
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android {/android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle.kts
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
