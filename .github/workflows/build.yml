name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate Android files
        run: flutter create --platforms=android .
        
      - name: Setup Fixed Keystore
        run: |
          rm -rf ~/.android
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Patch Android Files
        run: |
          python3 -c '
          import re
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          permissions = """    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
          """

          if "POST_NOTIFICATIONS" not in content:
              content = content.replace("<application", permissions + "    <application android:usesCleartextTraffic=\"true\"")
              
          with open(manifest_path, "w") as f:
              f.write(content)

          gradle_path = "android/app/build.gradle.kts"
          with open(gradle_path, "r") as f:
              gradle_content = f.read()

          if "useLegacyPackaging" not in gradle_content:
              gradle_content = gradle_content.replace("android {", """android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }""")
              
          with open(gradle_path, "w") as f:
              f.write(gradle_content)
          '
        
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
