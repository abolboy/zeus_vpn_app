name: Build ZEUS VPN

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder
        run: flutter create --platforms=android --project-name zeus_vpn --org ir.zeus .

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::No KEYSTORE_B64 secret -> debug signing: every build gets a DIFFERENT signature, so Android will refuse to update over the previous one. See tools/make_keystore.sh"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/zeus.jks
          printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=zeus.jks\\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 tools/patch_signing.py

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # Maven Central گاهی خطای 429 (Too Many Requests) می‌دهد؛ تا ۳ بار با فاصله تلاش می‌کنیم
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed (probably a Gradle/Maven network error); retrying in 40s"
            sleep 40
          done
          exit 1

      - name: Name APKs
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\\+.*//')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/ZEUS-VPN-v${VER}-${abi}.apk"
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeus-vpn-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\\+.*//')
          gh release create "$TAG" dist/*.apk \\
            --title "ZEUS VPN v${VER}" \\
            --generate-notes
