name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate Android files
        run: flutter create --platforms=android .
        
      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: zeus_vpn
          description: A VPN app using Zeus Panel.
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray: ^1.0.10
            dio: ^5.4.0
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          
      - name: Inject Custom main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter_v2ray/flutter_v2ray.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'dart:io';

          void main() {
            runApp(const ZeusVpnApp());
          }

          class ZeusVpnApp extends StatelessWidget {
            const ZeusVpnApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ZEUS VPN',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  primaryColor: Colors.blueAccent,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                ),
                home: const VpnHomePage(),
              );
            }
          }

          class VpnHomePage extends StatefulWidget {
            const VpnHomePage({super.key});

            @override
            State<VpnHomePage> createState() => _VpnHomePageState();
          }

          class _VpnHomePageState extends State<VpnHomePage> {
            final TextEditingController _subController = TextEditingController();
            final Dio _dio = Dio();
            
            List<String> _configs = [];
            Map<String, int> _latencies = {};
            String? _selectedConfig;
            
            bool _isLoading = false;
            bool _isConnected = false;
            bool _isTestingSpeed = false;
            String _status = 'قطع';
            String _speedResult = '';

            late FlutterV2ray _v2ray;

            @override
            void initState() {
              super.initState();
              _v2ray = FlutterV2ray(
                onStatusChanged: (status) {
                  setState(() {
                    _status = status.state;
                    _isConnected = (status.state == 'CONNECTED');
                    if (!_isConnected) _speedResult = '';
                  });
                },
              );
              _v2ray.initializeV2Ray();
              _loadSavedLink(); // خواندن لینک ذخیره شده در شروع
            }

            // ۱. خواندن لینک از حافظه گوشی
            Future<void> _loadSavedLink() async {
              final prefs = await SharedPreferences.getInstance();
              final savedLink = prefs.getString('subLink');
              if (savedLink != null && savedLink.isNotEmpty) {
                setState(() {
                  _subController.text = savedLink;
                });
                _fetchConfigs(); // اگر لینک وجود داشت، خودکار دریافت کن
              }
            }

            // ۲. ذخیره لینک در حافظه و دریافت سرورها
            Future<void> _fetchConfigs() async {
              if (_subController.text.isEmpty) return;
              
              // ذخیره لینک
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('subLink', _subController.text.trim());

              setState(() { 
                _isLoading = true; 
                _configs = []; 
                _latencies = {}; 
              });

              try {
                final response = await _dio.get(
                  _subController.text.trim(),
                  options: Options(headers: {'User-Agent': 'v2rayNG/1.8.5'}),
                );

                String body = response.data.toString().trim();
                try {
                  body = utf8.decode(base64.decode(base64.normalize(body)));
                } catch (_) {}

                final links = body.split('\n')
                    .map((e) => e.trim())
                    .where((e) => e.startsWith('vless://') || e.startsWith('trojan://') || e.startsWith('vmess://'))
                    .toList();

                setState(() {
                  _configs = links;
                  if (_configs.isNotEmpty) _selectedConfig = _configs.first;
                });

                _testAllLatencies();

              } catch (e) {
                _showSnackBar('خطا در دریافت لینک‌ها. لینک را چک کنید.');
              } finally {
                setState(() => _isLoading = false);
              }
            }

            // ۳. تست پینگ
            Future<void> _testAllLatencies() async {
              for (String config in _configs) {
                try {
                  final uri = Uri.parse(config);
                  final host = uri.host;
                  final port = uri.port;

                  final stopwatch = Stopwatch()..start();
                  final socket = await Socket.connect(host, port, timeout: const Duration(seconds: 3));
                  stopwatch.stop();
                  socket.destroy();

                  setState(() {
                    _latencies[config] = stopwatch.elapsedMilliseconds;
                  });
                } catch (e) {
                  setState(() {
                    _latencies[config] = -1;
                  });
                }
              }
            }

            // ۴. تست سرعت
            Future<void> _testSpeed() async {
              setState(() {
                _isTestingSpeed = true;
                _speedResult = 'در حال تست...';
              });

              try {
                final stopwatch = Stopwatch()..start();
                final response = await _dio.get(
                  'https://speed.cloudflare.com/__down?bytes=5000000',
                  options: Options(responseType: ResponseType.bytes),
                );
                stopwatch.stop();

                double seconds = stopwatch.elapsedMilliseconds / 1000.0;
                double bytes = response.data.length.toDouble();
                double mbps = ((bytes * 8) / (seconds * 1024 * 1024)).toStringAsFixed(2) as double;

                setState(() {
                  _speedResult = '$mbps Mbps';
                });
              } catch (e) {
                setState(() {
                  _speedResult = 'خطا در تست سرعت';
                });
              } finally {
                setState(() => _isTestingSpeed = false);
              }
            }

            // ۵. اتصال
            Future<void> _toggleConnection() async {
              if (_isConnected) { await _v2ray.stopV2Ray(); return; }
              if (_selectedConfig == null) { _showSnackBar('لطفاً ابتدا لینک اشتراک را دریافت کنید.'); return; }

              final hasPermission = await _v2ray.requestPermission();
              if (!hasPermission) { _showSnackBar('دسترسی VPN داده نشد.'); return; }

              final parser = FlutterV2ray.parseFromURL(_selectedConfig!);
              await _v2ray.startV2Ray(
                remark: 'ZEUS Server',
                config: parser.getFullConfiguration(),
                proxyOnly: false,
              );
            }

            void _showSnackBar(String msg) {
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('ZEUS VPN'), centerTitle: true),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      TextField(
                        controller: _subController,
                        decoration: const InputDecoration(
                          labelText: 'لینک اشتراک (Sub Link)',
                          border: OutlineInputBorder(),
                          prefixIcon: Icon(Icons.link),
                        ),
                      ),
                      const SizedBox(height: 12),
                      ElevatedButton.icon(
                        onPressed: _isLoading ? null : _fetchConfigs,
                        icon: const Icon(Icons.download),
                        label: Text(_isLoading ? 'در حال دریافت...' : 'دریافت / بروزرسانی سرورها'),
                      ),
                      const SizedBox(height: 24),
                      
                      if (_configs.isNotEmpty)
                        Container(
                          decoration: BoxDecoration(
                            border: Border.all(color: Colors.grey),
                            borderRadius: BorderRadius.circular(4),
                          ),
                          child: DropdownButtonHideUnderline(
                            child: DropdownButton<String>(
                              isExpanded: true,
                              padding: const EdgeInsets.symmetric(horizontal: 12),
                              value: _selectedConfig,
                              items: _configs.map((config) {
                                final name = config.split('#').last;
                                final ping = _latencies[config];
                                String pingText = '';
                                Color pingColor = Colors.grey;
                                if (ping != null) {
                                  if (ping == -1) {
                                    pingText = 'TimeOut';
                                    pingColor = Colors.red;
                                  } else {
                                    pingText = '$ping ms';
                                    pingColor = ping < 200 ? Colors.green : (ping < 500 ? Colors.orange : Colors.red);
                                  }
                                }

                                return DropdownMenuItem(
                                  value: config,
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Expanded(child: Text(name, overflow: TextOverflow.ellipsis)),
                                      if (pingText.isNotEmpty)
                                        Text(pingText, style: TextStyle(color: pingColor, fontSize: 12)),
                                    ],
                                  ),
                                );
                              }).toList(),
                              onChanged: (val) => setState(() => _selectedConfig = val),
                            ),
                          ),
                        ),
                      
                      const Spacer(),
                      
                      if (_speedResult.isNotEmpty)
                        Padding(
                          padding: const EdgeInsets.only(bottom: 16),
                          child: Text('سرعت دانلود: $_speedResult', 
                            textAlign: TextAlign.center, 
                            style: const TextStyle(fontSize: 16, color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                        ),

                      Text('وضعیت: $_status', textAlign: TextAlign.center, style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: _isConnected ? Colors.green : Colors.red)),
                      const SizedBox(height: 16),
                      
                      if (_isConnected)
                        Padding(
                          padding: const EdgeInsets.only(bottom: 16),
                          child: ElevatedButton.icon(
                            onPressed: _isTestingSpeed ? null : _testSpeed,
                            icon: const Icon(Icons.speed),
                            label: Text(_isTestingSpeed ? 'در حال تست...' : 'تست سرعت اینترنت'),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.blueGrey),
                          ),
                        ),

                      SizedBox(
                        height: 60,
                        child: ElevatedButton(
                          onPressed: _toggleConnection,
                          style: ElevatedButton.styleFrom(
                            backgroundColor: _isConnected ? Colors.red : Colors.green,
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(30)),
                          ),
                          child: Text(_isConnected ? 'قطع اتصال' : 'اتصال', style: const TextStyle(fontSize: 20, color: Colors.white)),
                        ),
                      ),
                      const SizedBox(height: 32),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Patch Gradle and Manifest for VPN
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android {/android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle.kts
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
