name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Generate Android files
        run: flutter create --platforms=android .
        
      # 🌟 کش کردن کلید برای آپدیت بدون حذف نسخه قبلی
      - name: Cache Android Debug Keystore
        uses: actions/cache@v3
        id: keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-debug-keystore-v1
          
      - name: Generate Keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: zeus_vpn
          description: A Cyberpunk VPN app using Zeus Panel.
          version: 1.0.0+${{ github.run_number }}

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray_client: ^3.4.1
            dio: ^5.4.0
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          
      - name: Inject Custom main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter_v2ray_client/flutter_v2ray.dart';
          import 'package:flutter_v2ray_client/model/v2ray_status.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:ui';
          import 'dart:math';

          void main() {
            runApp(const ZeusVpnApp());
          }

          class ZeusVpnApp extends StatelessWidget {
            const ZeusVpnApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ZEUS VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF050505),
                ),
                home: const VpnHomePage(),
              );
            }
          }

          class VpnHomePage extends StatefulWidget {
            const VpnHomePage({super.key});

            @override
            State<VpnHomePage> createState() => _VpnHomePageState();
          }

          class _VpnHomePageState extends State<VpnHomePage> with TickerProviderStateMixin {
            final TextEditingController _subController = TextEditingController();
            final Dio _dio = Dio();
            
            List<String> _configs = [];
            Map<String, int> _latencies = {};
            String? _selectedConfig;
            
            bool _isInitialized = false;
            bool _isLoading = false;
            bool _isConnected = false;
            bool _isTestingSpeed = false;
            String _speedTestResult = '';
            
            String _liveLog = '> SYSTEM BOOTING...';

            String _uploadSpeed = '0 B/s';
            String _downloadSpeed = '0 B/s';
            String _duration = '00:00:00';
            String _status = 'DISCONNECTED';

            final Color neonCyan = const Color(0xFF00F0FF);
            final Color neonMagenta = const Color(0xFFFF007F);
            final Color neonGreen = const Color(0xFF00FF88);
            final Color darkBg = const Color(0xFF050505);

            late V2ray _v2ray;
            late AnimationController _pulseController;
            late AnimationController _rotateController;
            late Animation<double> _pulseAnimation;

            @override
            void initState() {
              super.initState();
              
              _pulseController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat(reverse: true);
              
              _rotateController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 4),
              )..repeat();

              _pulseAnimation = Tween<double>(begin: 0.95, end: 1.05).animate(
                CurvedAnimation(parent: _pulseController, curve: Curves.easeInOut),
              );

              _v2ray = V2ray(
                onStatusChanged: (V2RayStatus status) {
                  if (mounted) {
                    setState(() {
                      _status = status.state;
                      _isConnected = (status.state == 'CONNECTED');
                      
                      _uploadSpeed = _formatSpeed(status.uploadSpeed);
                      _downloadSpeed = _formatSpeed(status.downloadSpeed);
                      _duration = status.duration;
                      
                      if (_isConnected) {
                        _liveLog = '> SECURE TUNNEL ESTABLISHED. PATT-NG ACTIVE.';
                      } else {
                        _speedTestResult = '';
                        _uploadSpeed = '0 B/s';
                        _downloadSpeed = '0 B/s';
                        _duration = '00:00:00';
                        _liveLog = '> TUNNEL DISCONNECTED.';
                      }
                    });
                  }
                },
              );
              _initV2Ray();
              _loadSavedLink();
            }

            Future<void> _initV2Ray() async {
              await _v2ray.initialize(
                notificationIconResourceType: "mipmap",
                notificationIconResourceName: "ic_launcher",
              );
              if (mounted) {
                setState(() {
                  _isInitialized = true;
                  _liveLog = '> CORE ONLINE. AWAITING COMMAND.';
                });
              }
            }

            @override
            void dispose() {
              _pulseController.dispose();
              _rotateController.dispose();
              super.dispose();
            }

            String _formatSpeed(int bytesPerSecond) {
              if (bytesPerSecond < 1024) return '$bytesPerSecond B/s';
              if (bytesPerSecond < 1024 * 1024) return '${(bytesPerSecond / 1024).toStringAsFixed(1)} KB/s';
              return '${(bytesPerSecond / (1024 * 1024)).toStringAsFixed(1)} MB/s';
            }

            Future<void> _loadSavedLink() async {
              final prefs = await SharedPreferences.getInstance();
              final savedLink = prefs.getString('subLink');
              if (savedLink != null && savedLink.isNotEmpty) {
                setState(() => _subController.text = savedLink);
                _fetchConfigs();
              }
            }

            String _parseConfigName(String uriStr) {
              try {
                final uri = Uri.parse(uriStr);
                if (uri.fragment.isNotEmpty) return Uri.decodeComponent(uri.fragment);
                return '${uri.host}:${uri.port}';
              } catch (_) { return 'Unknown Server'; }
            }

            // ⚡ تزریق تنظیمات PattNG
            String _applyPattNGSettings(String configUri) {
              try {
                final uri = Uri.parse(configUri);
                Map<String, String> queryParams = Map.from(uri.queryParameters);
                queryParams['fp'] = 'unsafe';
                queryParams['fragment'] = 'tlshello';
                return uri.replace(queryParameters: queryParams).toString();
              } catch (_) {
                return configUri;
              }
            }

            Future<void> _fetchConfigs() async {
              if (_subController.text.isEmpty) return;
              
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('subLink', _subController.text.trim());

              setState(() { 
                _isLoading = true; 
                _configs = []; 
                _latencies = {}; 
                _liveLog = '> FETCHING ENCRYPTED CONFIG...';
              });

              try {
                final response = await _dio.get(
                  _subController.text.trim(),
                  options: Options(headers: {'User-Agent': 'v2rayNG/1.8.5'}),
                );

                String body = response.data.toString().trim();
                try { body = utf8.decode(base64.decode(base64.normalize(body))); } catch (_) {}

                final links = body.split('\n')
                    .map((e) => e.trim())
                    .where((e) => e.startsWith('vless://') || e.startsWith('trojan://') || e.startsWith('vmess://'))
                    .map((link) => _applyPattNGSettings(link))
                    .toList();

                setState(() {
                  _configs = links;
                  if (_configs.isNotEmpty) _selectedConfig = _configs.first;
                  _liveLog = '> ${links.length} NODES INJECTED WITH PATT-NG PAYLOADS.';
                });

                _testAllLatencies();

              } catch (e) {
                setState(() => _liveLog = '> ERROR: SUBSCRIPTION FETCH FAILED.');
                _showSnackBar('Error fetching servers. Check link.', isError: true);
              } finally {
                setState(() => _isLoading = false);
              }
            }

            Future<void> _testAllLatencies() async {
              for (String config in _configs) {
                _pingSingleServer(config); // اجرای موازی برای جلوگیری از فریز شدن
              }
            }

            Future<void> _pingSingleServer(String config) async {
              try {
                final uri = Uri.parse(config);
                final stopwatch = Stopwatch()..start();
                final socket = await Socket.connect(uri.host, uri.port, timeout: const Duration(seconds: 3));
                stopwatch.stop();
                socket.destroy();
                if (mounted) setState(() => _latencies[config] = stopwatch.elapsedMilliseconds);
              } catch (e) {
                if (mounted) setState(() => _latencies[config] = -1);
              }
            }

            Future<void> _runSpeedTest() async {
              setState(() { _isTestingSpeed = true; _speedTestResult = 'TESTING...'; });
              try {
                final stopwatch = Stopwatch()..start();
                final response = await _dio.get(
                  'https://speed.cloudflare.com/__down?bytes=10000000',
                  options: Options(
                    responseType: ResponseType.bytes,
                    receiveTimeout: const Duration(seconds: 15),
                  ),
                );
                stopwatch.stop();
                double seconds = stopwatch.elapsedMilliseconds / 1000.0;
                if (seconds == 0) seconds = 0.1;
                double bytes = response.data.length.toDouble();
                double speedMbps = (bytes * 8) / (seconds * 1024 * 1024);
                setState(() {
                  _speedTestResult = '${speedMbps.toStringAsFixed(1)} Mbps';
                  _liveLog = '> BANDWIDTH SCAN: $_speedTestResult';
                });
              } catch (e) {
                setState(() {
                  _speedTestResult = 'FAILED';
                  _liveLog = '> SPEED TEST TIMEOUT.';
                });
              } finally {
                setState(() => _isTestingSpeed = false);
              }
            }

            Future<void> _toggleConnection() async {
              if (!_isInitialized) { _showSnackBar('Core is initializing...', isError: true); return; }
              if (_isConnected) { await _v2ray.stopV2Ray(); return; }
              if (_selectedConfig == null) { _showSnackBar('Please select a server first.', isError: true); return; }

              setState(() => _liveLog = '> INITIATING SECURE TUNNEL...');

              final hasPermission = await _v2ray.requestPermission();
              if (!hasPermission) { 
                setState(() => _liveLog = '> ERROR: VPN PERMISSION DENIED.');
                _showSnackBar('VPN permission denied.', isError: true); 
                return; 
              }

              final parser = V2ray.parseFromURL(_selectedConfig!);
              await _v2ray.startV2Ray(
                remark: parser.remark,
                config: parser.getFullConfiguration(),
                proxyOnly: false,
              );
            }

            void _showSnackBar(String msg, {bool isError = false}) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(msg, style: const TextStyle(color: Colors.white)),
                  backgroundColor: isError ? neonMagenta : neonGreen,
                  behavior: SnackBarBehavior.floating,
                )
              );
            }

            // 🚀 باز کردن لیست سرورها در BottomSheet
            void _showServerListModal() {
              showModalBottomSheet(
                context: context,
                backgroundColor: Colors.transparent,
                isScrollControlled: true,
                builder: (context) {
                  return Container(
                    height: MediaQuery.of(context).size.height * 0.6,
                    decoration: BoxDecoration(
                      color: const Color(0xFF0A0A0F),
                      borderRadius: const BorderRadius.vertical(top: Radius.circular(20)),
                      border: Border(top: BorderSide(color: neonCyan.withOpacity(0.5), width: 2)),
                    ),
                    child: Column(
                      children: [
                        const SizedBox(height: 10),
                        Container(width: 50, height: 4, decoration: BoxDecoration(color: neonCyan.withOpacity(0.5), borderRadius: BorderRadius.circular(10))),
                        const SizedBox(height: 15),
                        Text('NODE SELECTION', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: neonCyan, letterSpacing: 2)),
                        const SizedBox(height: 10),
                        Expanded(
                          child: ListView.builder(
                            padding: const EdgeInsets.symmetric(horizontal: 15),
                            itemCount: _configs.length,
                            itemBuilder: (context, index) {
                              final config = _configs[index];
                              final isSelected = config == _selectedConfig;
                              final name = _parseConfigName(config);
                              final ping = _latencies[config];

                              String pingText = '--';
                              Color pingColor = Colors.grey;
                              if (ping != null) {
                                if (ping == -1) { pingText = 'TIMEOUT'; pingColor = neonMagenta; }
                                else { 
                                  pingText = '$ping ms'; 
                                  pingColor = ping < 200 ? neonGreen : (ping < 500 ? Colors.orange : neonMagenta); 
                                }
                              }

                              return GestureDetector(
                                onTap: () {
                                  setState(() => _selectedConfig = config);
                                  Navigator.pop(context);
                                },
                                child: AnimatedContainer(
                                  duration: const Duration(milliseconds: 200),
                                  margin: const EdgeInsets.only(bottom: 10),
                                  padding: const EdgeInsets.all(15),
                                  decoration: BoxDecoration(
                                    color: isSelected ? neonCyan.withOpacity(0.15) : Colors.white.withOpacity(0.03),
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(color: isSelected ? neonCyan : Colors.transparent),
                                  ),
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Expanded(
                                        child: Text(name, style: TextStyle(color: isSelected ? Colors.white : Colors.white70, fontWeight: isSelected ? FontWeight.bold : FontWeight.normal)),
                                      ),
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                        decoration: BoxDecoration(
                                          color: pingColor.withOpacity(0.1),
                                          borderRadius: BorderRadius.circular(4),
                                          border: Border.all(color: pingColor.withOpacity(0.5)),
                                        ),
                                        child: Text(pingText, style: TextStyle(color: pingColor, fontSize: 10, fontWeight: FontWeight.bold)),
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  );
                }
              );
            }

            @override
            Widget build(BuildContext context) {
              String selectedName = _selectedConfig != null ? _parseConfigName(_selectedConfig!) : 'TAP TO SELECT NODE';
              String selectedPingText = '';
              Color selectedPingColor = Colors.grey;
              
              if (_selectedConfig != null && _latencies.containsKey(_selectedConfig)) {
                final p = _latencies[_selectedConfig]!;
                if (p == -1) { selectedPingText = 'TIMEOUT'; selectedPingColor = neonMagenta; }
                else { 
                  selectedPingText = '$p ms'; 
                  selectedPingColor = p < 200 ? neonGreen : (p < 500 ? Colors.orange : neonMagenta); 
                }
              }

              return Scaffold(
                backgroundColor: darkBg,
                body: Stack(
                  children: [
                    // افکت پس‌زمینه
                    Positioned.fill(
                      child: CustomPaint(painter: CyberGridPainter(neonCyan.withOpacity(0.05))),
                    ),
                    Positioned(
                      top: -100, left: -100,
                      child: Container(width: 300, height: 300, decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonCyan.withOpacity(0.1), blurRadius: 100, spreadRadius: 50)])),
                    ),
                    Positioned(
                      bottom: -100, right: -100,
                      child: Container(width: 300, height: 300, decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: neonMagenta.withOpacity(0.1), blurRadius: 100, spreadRadius: 50)])),
                    ),
                    
                    SafeArea(
                      child: Column(
                        children: [
                          // هدر
                          Padding(
                            padding: const EdgeInsets.only(top: 20, bottom: 10),
                            child: TweenAnimationBuilder<double>(
                              tween: Tween(begin: -1, end: 1),
                              duration: const Duration(milliseconds: 200),
                              builder: (context, value, child) {
                                return Transform.translate(
                                  offset: Offset(sin(value * pi) * 2, 0),
                                  child: Text(
                                    'ZEUS VPN',
                                    style: TextStyle(
                                      fontSize: 32,
                                      fontWeight: FontWeight.w900,
                                      letterSpacing: 8,
                                      color: Colors.white,
                                      shadows: [Shadow(color: neonCyan, blurRadius: 10), Shadow(color: neonMagenta, blurRadius: 20)],
                                    ),
                                  ),
                                );
                              },
                            ),
                          ),
                          
                          // لینک و تنظیمات
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 20),
                            child: Row(
                              children: [
                                Expanded(
                                  child: ClipRRect(
                                    borderRadius: BorderRadius.circular(10),
                                    child: BackdropFilter(
                                      filter: ImageFilter.blur(sigmaX: 5, sigmaY: 5),
                                      child: Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 10),
                                        decoration: BoxDecoration(
                                          color: Colors.white.withOpacity(0.05),
                                          border: Border.all(color: neonCyan.withOpacity(0.3)),
                                          borderRadius: BorderRadius.circular(10),
                                        ),
                                        child: TextField(
                                          controller: _subController,
                                          style: const TextStyle(color: Colors.white, fontSize: 12),
                                          decoration: InputDecoration(
                                            hintText: 'ENTER SUB LINK...',
                                            hintStyle: TextStyle(color: Colors.white.withOpacity(0.2), fontSize: 11),
                                            border: InputBorder.none,
                                          ),
                                        ),
                                      ),
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 10),
                                GestureDetector(
                                  onTap: _isLoading ? null : _fetchConfigs,
                                  child: Container(
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(
                                      color: neonCyan.withOpacity(0.1),
                                      border: Border.all(color: neonCyan.withOpacity(0.5)),
                                      borderRadius: BorderRadius.circular(10),
                                    ),
                                    child: Icon(Icons.sync, color: neonCyan, size: 20),
                                  ),
                                ),
                              ],
                            ),
                          ),
                          
                          const SizedBox(height: 20),

                          // دکمه انتخاب سرور
                          GestureDetector(
                            onTap: _configs.isEmpty ? () => _showSnackBar('Fetch servers first!', isError: true) : _showServerListModal,
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.05),
                                borderRadius: BorderRadius.circular(30),
                                border: Border.all(color: neonMagenta.withOpacity(0.5)),
                              ),
                              child: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Icon(Icons.dns, color: neonMagenta, size: 16),
                                  const SizedBox(width: 10),
                                  ConstrainedBox(
                                    constraints: const BoxConstraints(maxWidth: 150),
                                    child: Text(selectedName, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13), overflow: TextOverflow.ellipsis),
                                  ),
                                  if (selectedPingText.isNotEmpty) ...[
                                    const SizedBox(width: 8),
                                    Text('[$selectedPingText]', style: TextStyle(color: selectedPingColor, fontSize: 11, fontWeight: FontWeight.bold)),
                                  ],
                                  const SizedBox(width: 8),
                                  Icon(Icons.keyboard_arrow_down, color: neonMagenta, size: 16),
                                ],
                              ),
                            ),
                          ),

                          const Spacer(),

                          // دکمه پاور با افکت چرخشی
                          GestureDetector(
                            onTap: _toggleConnection,
                            child: ScaleTransition(
                              scale: _isConnected ? _pulseAnimation : const AlwaysStoppedAnimation(1.0),
                              child: Stack(
                                alignment: Alignment.center,
                                children: [
                                  // هاله چرخان
                                  RotationTransition(
                                    turns: _rotateController,
                                    child: Container(
                                      width: 160,
                                      height: 160,
                                      decoration: BoxDecoration(
                                        shape: BoxShape.circle,
                                        gradient: SweepGradient(
                                          colors: _isConnected 
                                              ? [neonGreen, Colors.transparent, neonGreen]
                                              : [neonCyan, Colors.transparent, neonCyan],
                                        ),
                                      ),
                                    ),
                                  ),
                                  // دکمه اصلی
                                  Container(
                                    width: 140,
                                    height: 140,
                                    decoration: BoxDecoration(
                                      shape: BoxShape.circle,
                                      color: darkBg,
                                      border: Border.all(color: _isConnected ? neonGreen : neonCyan, width: 2),
                                      boxShadow: [BoxShadow(color: (_isConnected ? neonGreen : neonCyan).withOpacity(0.3), blurRadius: 20, spreadRadius: 2)],
                                    ),
                                    child: Column(
                                      mainAxisAlignment: MainAxisAlignment.center,
                                      children: [
                                        Icon(Icons.power_settings_new, size: 45, color: _isConnected ? neonGreen : neonCyan),
                                        const SizedBox(height: 5),
                                        Text(_isConnected ? _duration : 'CONNECT', style: TextStyle(color: _isConnected ? neonGreen : neonCyan, fontSize: 12, letterSpacing: 1)),
                                      ],
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),

                          const Spacer(),

                          // پنل ضد سانسور PattNG
                          Container(
                            margin: const EdgeInsets.symmetric(horizontal: 20),
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(
                              color: Colors.white.withOpacity(0.02),
                              borderRadius: BorderRadius.circular(10),
                              border: Border.all(color: neonCyan.withOpacity(0.2)),
                            ),
                            child: Column(
                              children: [
                                Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                  children: [
                                    Text('ANTI-CENSORSHIP PROTOCOL', style: TextStyle(color: neonCyan, fontSize: 10, fontWeight: FontWeight.bold)),
                                    Icon(Icons.security, color: neonGreen, size: 14),
                                  ],
                                ),
                                const Divider(color: Colors.white12),
                                Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceAround,
                                  children: [
                                    _buildPattStat('UNSAFE FP', 'ACTIVE', neonMagenta),
                                    _buildPattStat('TLS FRAGMENT', 'INJECTED', neonCyan),
                                    _buildPattStat('CIPHER SUITE', 'AUTO', neonGreen),
                                  ],
                                ),
                              ],
                            ),
                          ),
                          
                          const SizedBox(height: 15),

                          // آمار
                          if (_isConnected)
                            Padding(
                              padding: const EdgeInsets.symmetric(horizontal: 20),
                              child: Row(
                                mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                children: [
                                  _buildStat('UP', _uploadSpeed, Icons.arrow_upward, neonMagenta),
                                  _buildStat('DOWN', _downloadSpeed, Icons.arrow_downward, neonCyan),
                                  GestureDetector(
                                    onTap: _isTestingSpeed ? null : _runSpeedTest,
                                    child: _buildStat('SPEED', _isTestingSpeed ? '...' : (_speedTestResult.isNotEmpty ? _speedTestResult : 'TEST'), Icons.speed, neonGreen),
                                  ),
                                ],
                              ),
                            ),

                          const SizedBox(height: 15),

                          // ترمینال زنده
                          Container(
                            width: double.infinity,
                            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                            color: Colors.black.withOpacity(0.5),
                            child: Text(
                              _liveLog,
                              style: TextStyle(color: neonGreen.withOpacity(0.8), fontSize: 10, fontFamily: 'monospace'),
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildPattStat(String title, String value, Color color) {
              return Column(
                children: [
                  Text(value, style: TextStyle(color: color, fontSize: 10, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 2),
                  Text(title, style: TextStyle(color: Colors.white.withOpacity(0.3), fontSize: 8)),
                ],
              );
            }

            Widget _buildStat(String title, String value, IconData icon, Color color) {
              return Column(
                children: [
                  Icon(icon, color: color, size: 16),
                  const SizedBox(height: 4),
                  Text(value, style: TextStyle(color: color, fontSize: 12, fontWeight: FontWeight.bold)),
                ],
              );
            }
          }

          class CyberGridPainter extends CustomPainter {
            final Color gridColor;
            CyberGridPainter(this.gridColor);

            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()..color = gridColor..strokeWidth = 1.0;
              final double horizon = size.height * 0.4;
              final double centerX = size.width / 2;

              for (double i = 1; i <= 15; i++) {
                final double y = horizon + (size.height - horizon) * (i / 15) * (i / 15);
                canvas.drawLine(Offset(0, y), Offset(size.width, y), paint);
              }

              for (double i = -15; i <= 15; i++) {
                final double x = centerX + (size.width / 10) * i;
                canvas.drawLine(Offset(centerX, horizon), Offset(x, size.height), paint);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }
          EOF

      - name: Patch AndroidManifest for VPN & Notifications
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # تزریق مجوزها
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"\/>\n    <application android:usesCleartextTraffic="true"/' $MANIFEST
          
      - name: Patch Gradle for VPN
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          sed -i 's/android {/android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' $GRADLE_FILE
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
