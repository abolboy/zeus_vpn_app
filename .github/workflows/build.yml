name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android folder
        run: flutter create --platforms=android .
      - name: Patch Android files
        run: python3 tools/patch_android.py
      - name: Signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using keystore from the KEYSTORE_B64 repository secret"
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          elif [ -f ci/keystore.b64 ]; then
            echo "::warning::Signing with the keystore committed in this public repo (ci/keystore.b64). Anyone can sign an APK with this key. Move it to a secret named KEYSTORE_B64 and delete the file."
            base64 -d ci/keystore.b64 > ~/.android/debug.keystore
          else
            echo "::warning::No keystore found. Using a one-off key for this build only; updates will not install over older builds. Add the KEYSTORE_B64 secret for a stable signature."
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,OU=Test,O=Test,C=US"
          fi
      - name: Pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          REL=$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" -d "{\"tag_name\":\"build-$RUN_NO\",\"name\":\"ZEUS VPN Build $RUN_NO\"}")
          ID=$(echo "$REL" | jq -r .id)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Release creation failed: $REL"
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK" "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=ZEUS-VPN.apk" > /dev/null
