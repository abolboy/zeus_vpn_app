name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android folder
        run: flutter create --platforms=android .
      - name: Patch Android files
        run: python3 tools/patch_android.py
      - name: Create keystore
        run: rm -rf ~/.android && mkdir -p ~/.android && keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname CN=Android,OU=Test,O=Test,C=US
      - name: Pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeus-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/abolboy/zeus_vpn_app/releases -d "{\"tag_name\":\"build-${{ github.run_number }}\",\"name\":\"ZEUS VPN Build ${{ github.run_number }}\"}")
          ID=$(echo "$REL" | jq -r .id)
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @build/app/outputs/flutter-apk/app-release.apk "https://uploads.github.com/repos/abolboy/zeus_vpn_app/releases/$ID/assets?name=ZEUS-VPN.apk"
