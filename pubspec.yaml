name: zeus_vpn
description: ZEUS VPN — Hacker Matrix HUD with PattNG
publish_to: 'none'
version: 2.6.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # هسته اتصال
  flutter_v2ray_client: ^3.5.0

  # شبکه و ذخیره‌سازی
  dio: ^5.4.0
  url_launcher: ^6.3.1
  installed_apps: ^2.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
